<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="author" content="Solo Apps Studio" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0a0118" />
  <title>Neon Flappy</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="hud">
      <div id="scoreBox">
        <div id="score">0</div>
        <div id="best"></div>
      </div>
    </div>

    <main id="stage">
      <canvas id="game"></canvas>

      <div id="overlay" class="overlay visible">
        <h1 id="overlayTitle">NEON<br>FLAPPY</h1>
        <p id="overlaySubtitle">Tap or press Space to fly</p>
        <button id="startBtn" class="btn">TAP TO START</button>
        <p class="hint">Tap · Click · Space · ↑</p>
      </div>
    </main>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
